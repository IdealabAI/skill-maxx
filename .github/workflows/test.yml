name: Skill installers
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test clarification form builder
        run: node --test tests/form.test.cjs
      - name: Test Windows PowerShell 5.1 installer
        shell: powershell
        run: ./tests/install.Tests.ps1
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test clarification form builder
        run: node --test tests/form.test.cjs
      - name: Test system Bash installer
        run: /bin/bash tests/install.test.sh
